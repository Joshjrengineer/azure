<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeZilla Lite (Free)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>TradeZilla Lite</h1>
      <p>A free, private trading journal to track your progress.</p>
    </header>

    <main>
      <section class="panel">
        <h2>Add Trade</h2>
        <form id="trade-form">
          <div class="grid">
            <label>Date <input type="date" id="date" required /></label>
            <label>Symbol <input type="text" id="symbol" placeholder="AAPL" required /></label>
            <label>Side
              <select id="side" required>
                <option value="long">Long</option>
                <option value="short">Short</option>
              </select>
            </label>
            <label>Entry <input type="number" step="0.0001" id="entry" required /></label>
            <label>Exit <input type="number" step="0.0001" id="exit" required /></label>
            <label>Quantity <input type="number" step="0.0001" id="qty" required /></label>
            <label>Fees <input type="number" step="0.01" id="fees" value="0" min="0" /></label>
            <label>Setup Tag <input type="text" id="tag" placeholder="breakout" /></label>
          </div>
          <label>Notes
            <textarea id="notes" rows="3" placeholder="Why did you enter? How did you manage risk?"></textarea>
          </label>
          <button type="submit">Save Trade</button>
        </form>
      </section>

      <section class="panel">
        <h2>Performance Snapshot</h2>
        <div id="stats" class="stats"></div>
      </section>

      <section class="panel">
        <div class="table-header">
          <h2>Trade Journal</h2>
          <div>
            <button id="export-btn" type="button">Export CSV</button>
            <button id="clear-btn" type="button" class="danger">Clear All</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Symbol</th>
                <th>Side</th>
                <th>Entry</th>
                <th>Exit</th>
                <th>Qty</th>
                <th>Fees</th>
                <th>Tag</th>
                <th>P/L</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="trade-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>
      <small>
        Built for your trading journey. Data is stored locally in your browser.
      </small>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
